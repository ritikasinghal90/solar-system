name: Solar System Workflow

on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            nodejs_version: [18, 20]
            os: [ubuntu-latest, macos-latest]
            exclude:
              - nodejs_version: 18
                os: macos-latest
              - os: macos-latest
        services:
          mongodb-service:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
            
            - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
              uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.nodejs_version }}

#            - name: Get npm cache directory
#              id: npm-cache-dir
#              shell: bash
#              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - uses: actions/cache@v6
              id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
              with:
#                path: ${{ steps.npm-cache-dir.outputs.dir }}
                path: node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                restore-keys: |
                  ${{ runner.os }}-node

            - name: Install Dependencies
              run: npm install

            - name: Unit Testing
              id: unit-test
              run: npm test

            - name: Archive Unit Test Result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: Moch-Test-Result
                path: test-results.xml
                retention-days: 2

    code-coverage:
      name: Code COverage
      runs-on: ubuntu-latest
      container:
          image: node:18
      services:
        mongodb-service:
          image: siddharth67/mongo-db:non-prod
      env:
        MONGO_URI: 'mongodb://mongodb-service:27017/superData'
        MONGO_USERNAME: non-prod-user
        MONGO_PASSWORD: non-prod-password
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

#        - name: Setup NodeJS Version - 18
#          uses: actions/setup-node@v7
#          with:
#            node-version: 18

        - uses: actions/cache@v6
          id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node

        - name: Install Dependencies
          run: npm install

        - name: Run Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Code Coverage Result
          uses: actions/upload-artifact@v7
          with:
            name: Code-Coverage-Results
            path: coverage
            retention-days: 2

    docker:
      name: Containerization
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: Login to GHCR Hub
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Docker Build For Testing
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
            
            echo "Testing image url using wget"
            wget -q -O - 127.0.0.1:3000/live | grep 'live'

        - name: Docker Push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
              ghcr.io/${{ github.repository_owner }}/github-demo-repo:${{ github.sha }}
              
    dev-deploy:
      needs: [docker]
      runs-on: ubuntu-latest
      environment:
        name: development
        url: https://${{ steps.app-ingress-host.outputs.APP_INGRESS_HOST }}
      outputs:
        APP_INGRESS_URL: ${{ steps.app-ingress-host.outputs.APP_INGRESS_HOST }}
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Install Kubectl CLI
          uses: azure/setup-kubectl@v4
          with:
             version: 'v1.26.0'

        - name: Setup Kubeconfig
          uses: azure/k8s-set-context@v5
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBECONFIG }}

        - name: Get Cluster Info
          run: |
            echo "kubectl version --short"

        - name: Get Nginx Ingress Controller IP
#          run: |
#            echo "INGRESS_IP=$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o=jsonpath='{.status.loadbalancer.ingress[0].ip}')" >> GITHUB_ENV
          run: |
            echo "INGRESS_IP=172.234.45.65" >> "$GITHUB_ENV"     #For testing
            

        - name: Replace Token In Manifest Files
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check Files
          run: |
            cat kubernetes/development/*.yaml

        - name: Create Mongodb Secret
          run: |
            echo "kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
            --from-literal=MONGO_URI=$MONGO_URI \
            --from-literal=MONGO_USERNAME=$MONGO_USERNAME \
            --from-literal=MONGO_PASSWORD=$MONGO_PASSWORD \
            --save-config \
            --dry-run=client \
            -o yaml | kubectl apply -f -"

        - name: Deploy To Dev
          run: |
            echo "kubectl apply -f kubernetes/development"
            
        - name: Get Application Ingress Host URL
          id: app-ingress-host
#          run: |
#            echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.tls.hosts[0]}')"
          run: |
            echo "APP_INGRESS_HOST=solar-system-${{ vars.NAMESPACE }}.${{ env.INGRESS_IP }}.nip.io" >> "$GITHUB_OUTPUT"

    dev-integration-testing:
      name: Dev Integration Testing
      needs: [dev-deploy]
      runs-on: ubuntu-latest
      steps:
        - name: Test URL Output curl and jq
          env:
            URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo $URL
            echo "----------"
            echo "curl https://$URL/live -s -k | jq -r .status | grep live"
  

            


