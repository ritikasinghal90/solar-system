name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature/**'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit testing
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
      MONGO_URI: 'mongodb://localhost:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    strategy:
      matrix:
        nodejs_version: [18, 20]
        os: [ ubuntu-latest, macos-latest ]
        exclude:
          - os: macos-latest
            nodejs_version: 18
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Nodejs ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodejs_version }}

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Run unit Testcases
        run: npm test

      - name: Upload Unit Test Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moch-Test-Result-${{ matrix.nodejs_version }}-${{ runner.os }}
          path: test-results.xml
          retention-days: 2

  code-coverage:
    name: Code Coverag
    runs-on: ubuntu-latest
    container:
      image: node:18
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
    env:
      MONGO_URI: 'mongodb://mongo-db:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

#      - name: Setup Nodejs 18
#        uses: actions/setup-node@v7
#        with:
#          node-version: 18

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Code-Coverage-Test-Result
          path: coverage/
          retention-days: 2

  docker:
    name: Containerization
    runs-on: ubuntu-latest
    needs: [unit-testing, code-coverage]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}


      - name: Docker Image Test
        run: |
          docker images
          docker run -d --name solar-systaem-app \
          -p 3000:3000 \
          -e MONGO_URI=${{ env.MONGO_URI }} \
          -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
          -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
          ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
          
          echo "Testing Image URL using wget"
          wget -q -O - 127.0.0.1:3000/live | grep -i 'live'

      - name: Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
#            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

  dev-deploy:
    name: Dev Deployment
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.26.0'

      - name: Setup Kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Fetch Kubernetes Details
        run: |
          echo "kubectl version --short"

      - name: Save Ingress COntroller IP As Github Env
        run: |
          echo "INGRESS_IP=172.26.54.40" >> "$GITHUB_ENV"

      - name: Replace Tokens
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Check Files
        run: |
          cat kubernetes/development/*.yaml

      - name: Crete mongodb Secret
        run: |
          echo "kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
          --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
          --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
          --from-literal=MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
          --save-config \
          --dry-run=client \
          -o yaml > kubectl apply -f -

      - name: Deploy To De Env
        run: |
          echo "kubectl apply -f kubernetes/Development"