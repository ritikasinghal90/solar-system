name: Solar System Workflow

on:
    workflow_dispatch:
    push:
        branches:
            - 'main'
            - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        strategy:
          matrix:
            nodejs_version: [18, 20]
            os: [ubuntu-latest, macos-latest]
            exclude:
              - nodejs_version: 18
                os: macos-latest
              - os: macos-latest
        services:
          mongodb-service:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
            
            - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
              uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.nodejs_version }}

#            - name: Get npm cache directory
#              id: npm-cache-dir
#              shell: bash
#              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - uses: actions/cache@v6
              id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
              with:
#                path: ${{ steps.npm-cache-dir.outputs.dir }}
                path: node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                restore-keys: |
                  ${{ runner.os }}-node

            - name: Install Dependencies
              run: npm install

            - name: Unit Testing
              id: unit-test
              run: npm test

            - name: Archive Unit Test Result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: Moch-Test-Result
                path: test-results.xml
                retention-days: 2

    code-coverage:
      name: Code COverage
      runs-on: ubuntu-latest
      container:
          image: node:18
      services:
        mongodb-service:
          image: siddharth67/mongo-db:non-prod
      env:
        MONGO_URI: 'mongodb://mongodb-service:27017/superData'
        MONGO_USERNAME: non-prod-user
        MONGO_PASSWORD: non-prod-password
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

#        - name: Setup NodeJS Version - 18
#          uses: actions/setup-node@v7
#          with:
#            node-version: 18

        - uses: actions/cache@v6
          id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node

        - name: Install Dependencies
          run: npm install

        - name: Run Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Code Coverage Result
          uses: actions/upload-artifact@v7
          with:
            name: Code-Coverage-Results
            path: coverage
            retention-days: 2

    docker:
      name: Containerization
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: Login to GHCR Hub
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Docker Build For Testing
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
            
            echo "Testing image url using wget"
            wget -q -O - 127.0.0.1:3000/live | grep 'live'

        - name: Docker Push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
              ghcr.io/${{ github.repository_owner }}/github-demo-repo:${{ github.sha }}
              
    dev-deploy:
      name: Dev Deployment
      if: contains(github.ref, 'feature/')
      needs: [docker]
      uses: ./.github/workflows/reuse-deployment.yaml
      secrets:
        k8s_Kubeconfig: ${{ secrets.KUBECONFIG }}
        mongodb-password: ${{ secrets.MONGO_PASSWORD }}
      with:
        mongodb-uri: ${{ vars.MONGO_URI }}
        k8s-manifest-dir: kubernetes/development/
        environment: development

    dev-integration-testing:
      name: Dev Integration Testing
      if: contains(github.ref, 'feature/')
      needs: [dev-deploy]
      runs-on: ubuntu-latest
      steps:
        - name: Test URL Output curl and jq
          env:
            URL: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo $URL
            echo "----------"
            echo "curl https://$URL/live -s -k | jq -r .status | grep live"

    prod-deploy:
      name: Prod Deployment
      if: github.ref == 'refs/heads/main'
      needs: [docker]
      uses: ./.github/workflows/reuse-deployment.yaml
      secrets:
        k8s_Kubeconfig: ${{ secrets.KUBECONFIG }}
        mongodb-password: ${{ secrets.MONGO_PASSWORD }}
      with:
        mongodb-uri: ${{ vars.MONGO_URI }}
        k8s-manifest-dir: kubernetes/production/
        environment: production

    prod-integration-testing:
      name: Prod Integration Testing
      if: github.ref == 'refs/heads/main'
      needs: [prod-deploy]
      runs-on: ubuntu-latest
      steps:
        - name: Test URL Output curl and jq
          env:
            URL: ${{ needs.prod-deploy.outputs.APP_INGRESS_URL }}
          run: |
            echo $URL
            echo "----------"
            echo "curl https://$URL/live -s -k | jq -r .status | grep live"
  

            


