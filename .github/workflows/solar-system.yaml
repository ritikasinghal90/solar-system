name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature/**'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

permissions:
  contents: read
  packages: write

jobs:
  unit-testing:
    name: Unit testing
    strategy:
      matrix:
        nodejs_version: [18, 20]
        os: [ ubuntu-latest, macos-latest ]
        exclude:
          - os: macos-latest
            nodejs_version: 18
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Nodejs ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodejs_version }}

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Run unit Testcases
        run: npm test

      - name: Upload Unit Test Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moch-Test-Result-${{ matrix.nodejs_version }}-${{ runner.os }}
          path: test-results.xml
          retention-days: 2

  code-coverage:
    name: Code Coverag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Nodejs 18
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Code-Coverage-Test-Result
          path: coverage/
          retention-days: 2

  docker:
    name: Containerization
    runs-on: ubuntu-latest
    needs: [unit-testing, code-coverage]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}


      - name: Docker Image Test
        run: |
          docker images
          docker run -d --name solar-systaem-app \
          -p 3000:3000 \
          -e MONGO_URI=${{ env.MONGO_URI }} \
          -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
          -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
          ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
          
          echo "Testing Image URL using wget"
          wget -q -O - 127.0.0.1:3000/live | grep -i 'live'

      - name: Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}