name: Deployment Reusable Workflow

on:
  workflow_call:
    secrets:
      k8s-kubeconfig:
        required: true
      mongodb-password:
        required: true
    inputs:
      mongodb-uri:
        type: string
        required: true
      kubectl-version:
        description: Provide the required kubectl version
        default: v1.27.0
        type: string
        required: false
      k8s-manifest-dir:
        description: Directory containing k8s manifest files
        default: kubernetes/
        type: string
        required: true
      environment:
        description: Provide the Deployment Environment
        default: dev
        type: string
        required: true


jobs:
  reuse-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ steps.set-ingress-host.outputs.APP_INGRESS_HOST }}
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host.outputs.APP_INGRESS_HOST }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: '${{ inputs.kubectl-version }}'

      - name: Setup Kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.k8s-kubeconfig }}

      - name: Fetch Kubernetes Details
        run: |
          echo "kubectl version --short"

      - name: Save Ingress COntroller IP As Github Env
        run: |
          echo "INGRESS_IP=172.26.54.40" >> "$GITHUB_ENV"

      - name: Replace Tokens
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["${{ inputs.k8s-manifest-dir }}*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/github-demo-repo:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Check Files
        run: |
          cat ${{ inputs.k8s-manifest-dir }}*.yaml

      - name: Crete mongodb Secret
        run: |
          echo "kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
          --from-literal=MONGO_URI=${{ inputs.mongodb-uri }} \
          --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
          --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
          --save-config \
          --dry-run=client \
          -o yaml > kubectl apply -f -"

      - name: Deploy To De Env
        run: |
          echo "kubectl apply -f ${{ inputs.k8s-manifest-dir }}"

      - name: Set Application Ingress Host
        id: set-ingress-host
        run: |
          echo "APP_INGRESS_HOST=solar-system-development.172.26.54.40.nip.io" >> "$GITHUB_OUTPUT"
