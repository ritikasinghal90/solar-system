name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'feature/**'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit testing
    strategy:
      matrix:
        nodejs_version: [18, 20]
        os: [ ubuntu-latest, macos-latest ]
        exclude:
          - os: macos-latest
            nodejs_version: 18
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Nodejs ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Install Dependencies
        run: npm install

      - name: Run unit Testcases
        run: npm test

      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Moch-Test-Result-${{ matrix.nodejs_version }}-${{ runner.os }}
          path: test-results.xml
          retention-days: 2

  code-coverage:
    name: Code Coverag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Nodejs 18
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Code-Coverage-Test-Result
          path: coverage/
          retention-days: 2